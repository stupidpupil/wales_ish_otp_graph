'on':
  workflow_dispatch: ~
name: build-and-release-hetzner-test
jobs:

  create-runner:
    name: Create Hetzner Cloud runner
    needs:
      - download_and_prepare_terrain
      - download_and_prepare_osm
      - merge_and_pfaedle_gtfs
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.create-hcloud-runner.outputs.label }}
      server_id: ${{ steps.create-hcloud-runner.outputs.server_id }}
    steps:
      - name: Create runner
        id: create-hcloud-runner
        uses: Cyclenerd/hcloud-github-runner@v1
        with:
          mode: create
          github_token: ${{ secrets.GH_PAT }}
          hcloud_token: ${{ secrets.HETZNER_API_TOKEN }}
          server_type: cpx62
          image: 'ubuntu-24.04'
          

  download_and_prepare_terrain:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Get Terrain 50 md5
      id: terrain50_md5
      run: |
        echo "md5=$(curl 'https://api.os.uk/downloads/v1/products/Terrain50/downloads' | jq '.[0].md5')" >> $GITHUB_OUTPUT
    - name: Cache Terrain 50
      id: cache_terrain50
      uses: actions/cache@v5
      with:
        path: |
          output/*terr50*
        key: ${{ steps.terrain50_md5.outputs.md5 }}-${{ hashFiles('config.yml') }}-terr50-v1
    - uses: r-lib/actions/setup-r@v2
      if: steps.cache_terrain50.outputs.cache-hit != 'true'
    - uses: r-lib/actions/setup-pandoc@v2
      if: steps.cache_terrain50.outputs.cache-hit != 'true'
    - uses: r-lib/actions/setup-r-dependencies@v2
      if: steps.cache_terrain50.outputs.cache-hit != 'true'
    - name: Download terrain
      if: steps.cache_terrain50.outputs.cache-hit != 'true'
      run: |
        devtools::load_all()
        download_terrain50()
      shell: Rscript {0}
    - name: Prepare_terrain
      if: steps.cache_terrain50.outputs.cache-hit != 'true'
      run: |
        devtools::load_all()
        prepare_terrain50()
      shell: Rscript {0}
    - name: Upload Terrain 50 artifact
      uses: actions/upload-artifact@v7
      with:
        name: terr50.tif
        path: output/*terr50*
        if-no-files-found: error
        compression-level: 9
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      BOUNDS: ${{ secrets.BOUNDS }}
      OUTPUT_AFFIX: ${{ secrets.OUTPUT_AFFIX }}
  download_and_prepare_osm:
    runs-on: macOS-latest
    steps:
    - uses: actions/checkout@v6
    - name: Get Geofabrik Location
      id: geofabrik_location
      run: |
        echo "loc=$(curl -I 'https://download.geofabrik.de/europe/great-britain-latest.osm.pbf' | grep 'Location')" >> $GITHUB_OUTPUT
    - name: Cache OSM
      id: cache_osm
      uses: actions/cache@v5
      with:
        path: |
          output/openstreetmap/*
        key: ${{ steps.geofabrik_location.outputs.loc }}-${{ hashFiles('config.yml')
          }}-osm-v1
    - uses: r-lib/actions/setup-r@v2
      if: steps.cache_osm.outputs.cache-hit != 'true'
    - uses: r-lib/actions/setup-pandoc@v2
      if: steps.cache_osm.outputs.cache-hit != 'true'
    - uses: r-lib/actions/setup-r-dependencies@v2
      if: steps.cache_osm.outputs.cache-hit != 'true'
    - name: Install osmium
      run: brew install osmium-tool
      if: steps.cache_osm.outputs.cache-hit != 'true'
    - name: Download and prepare OSM
      if: steps.cache_osm.outputs.cache-hit != 'true'
      run: |
        devtools::load_all()
        download_and_prepare_osm()
      shell: Rscript {0}
    - name: Upload OpenStreetMap artifact
      uses: actions/upload-artifact@v7
      with:
        name: openstreetmap
        path: output/openstreetmap/*
        if-no-files-found: error
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      BOUNDS: ${{ secrets.BOUNDS }}
      OUTPUT_AFFIX: ${{ secrets.OUTPUT_AFFIX }}
  prepare_street_graph:
    needs:
    - download_and_prepare_terrain
    - download_and_prepare_osm
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Download OpenStreetMap artifact
      uses: actions/download-artifact@v8
      with:
        name: openstreetmap
        path: output/openstreetmap/
    - name: Download Terrain 50 artifact
      uses: actions/download-artifact@v8
      with:
        name: terr50.tif
        path: output
    - name: Derive hash from ParochialCacheKeys
      id: parochial_cache_keys
      run: |-
        echo "hash=$(
          find output -name "*.meta.json" | sort | xargs jq .ParochialCacheKey | shasum -a 1
        )" >> $GITHUB_OUTPUT
    - name: Cache street graph
      id: cache_street_graph
      uses: actions/cache@v5
      with:
        path: output/opentripplanner/streetGraph.obj*
        key: ${{ hashFiles('config.yml') }}-${{ steps.parochial_cache_keys.outputs.hash
          }}-otp.street-v1
    - uses: r-lib/actions/setup-r@v2
      if: steps.cache_street_graph.outputs.cache-hit != 'true'
    - uses: r-lib/actions/setup-pandoc@v2
      if: steps.cache_street_graph.outputs.cache-hit != 'true'
    - uses: r-lib/actions/setup-r-dependencies@v2
      if: steps.cache_street_graph.outputs.cache-hit != 'true'
    - name: Download OTP
      if: steps.cache_street_graph.outputs.cache-hit != 'true'
      run: |
        devtools::load_all()
        download_otp()
      shell: Rscript {0}
    - name: Cache OTP elevation lookups
      if: steps.cache_street_graph.outputs.cache-hit != 'true'
      uses: actions/cache@v5
      with:
        path: data-raw/otp_cache/*
        key: ${{ hashFiles('output/*terr50*') }}
    - name: Install Java 25
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '25'
      if: steps.cache_street_graph.outputs.cache-hit != 'true'
    - name: Prepare street graph
      if: steps.cache_street_graph.outputs.cache-hit != 'true'
      run: |
        devtools::load_all()
        prepare_street_graph()
      shell: Rscript {0}
    - name: Upload street graph artifact
      uses: actions/upload-artifact@v7
      with:
        name: streetGraph.obj
        path: output/opentripplanner/streetGraph.obj*
        if-no-files-found: error
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      BOUNDS: ${{ secrets.BOUNDS }}
      OUTPUT_AFFIX: ${{ secrets.OUTPUT_AFFIX }}
  download_and_prepare_gtfs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Get Date
      id: get-date
      run: |
        echo "date=$(/bin/date -u "+%Y%m%d")" >> $GITHUB_OUTPUT
      shell: bash
    - name: Cache TravelWhiz GTFS
      id: cache_travel_whizgtfs
      uses: actions/cache@v5
      with:
        path: output/gtfs/*.gtfs.zip*
        key: ${{ steps.get-date.outputs.date }}-${{ hashFiles('config.yml') }}-travelwhiz.gtfs-v1
    - uses: r-lib/actions/setup-r@v2
      if: steps.cache_travel_whizgtfs.outputs.cache-hit != 'true'
    - uses: r-lib/actions/setup-pandoc@v2
      if: steps.cache_travel_whizgtfs.outputs.cache-hit != 'true'
    - uses: r-lib/actions/setup-r-dependencies@v2
      if: steps.cache_travel_whizgtfs.outputs.cache-hit != 'true'
    - name: Download and prepare TravelWhiz GTFS
      if: steps.cache_travel_whizgtfs.outputs.cache-hit != 'true'
      run: |
        devtools::load_all()
        download_travelwhiz_bus_metro_gtfs()
        download_travelwhiz_nationalrail_gtfs()
        prepare_gtfs()
      shell: Rscript {0}
    - name: Upload TravelWhiz GTFS artifact
      uses: actions/upload-artifact@v7
      with:
        name: travelwhiz.gtfs.zip
        path: output/gtfs/*.gtfs.zip*
        if-no-files-found: error
        compression-level: 0
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      BOUNDS: ${{ secrets.BOUNDS }}
      OUTPUT_AFFIX: ${{ secrets.OUTPUT_AFFIX }}
  merge_and_pfaedle_gtfs:
    needs:
    - download_and_prepare_gtfs
    - download_and_prepare_osm
    runs-on: macOS-latest
    steps:
    - uses: actions/checkout@v6
    - name: Download TravelWhiz GTFS artifact
      uses: actions/download-artifact@v8
      with:
        name: travelwhiz.gtfs.zip
        path: output/gtfs
    - name: Download OpenStreetMap artifact
      uses: actions/download-artifact@v8
      with:
        name: openstreetmap
        path: output/openstreetmap/
    - name: Derive hash from ParochialCacheKeys
      id: parochial_cache_keys
      run: |-
        echo "hash=$(
          find output -name "*.meta.json" | sort | xargs jq .ParochialCacheKey | shasum -a 1
        )" >> $GITHUB_OUTPUT
    - name: Cache Merged GTFS
      id: cache_merged_gtfs
      uses: actions/cache@v5
      with:
        path: |
          output/gtfs/merged.*.gtfs.zip*
        key: ${{ hashFiles('config.yml') }}-${{ steps.parochial_cache_keys.outputs.hash
          }}-merged.gtfs-v2
    - uses: r-lib/actions/setup-r@v2
      if: steps.cache_merged_gtfs.outputs.cache-hit != 'true'
    - uses: r-lib/actions/setup-pandoc@v2
      if: steps.cache_merged_gtfs.outputs.cache-hit != 'true'
    - uses: r-lib/actions/setup-r-dependencies@v2
      if: steps.cache_merged_gtfs.outputs.cache-hit != 'true'
    - name: Install osmium
      run: brew install osmium-tool
      if: steps.cache_merged_gtfs.outputs.cache-hit != 'true'
    - uses: actions/setup-go@v6
      with:
        go-version: stable
      if: steps.cache_merged_gtfs.outputs.cache-hit != 'true'
    - name: Get gtfstidy
      run: go install github.com/patrickbr/gtfstidy@d4a954bf68703563a6de4e6c3beb841a00063239
      if: steps.cache_merged_gtfs.outputs.cache-hit != 'true'
    - name: Merge and Pfaedle Merged GTFS
      if: steps.cache_merged_gtfs.outputs.cache-hit != 'true'
      run: |
        devtools::load_all()
        prepare_merged_gtfs(should_pfaedle = FALSE)
      shell: Rscript {0}
    - name: Upload Merged GTFS artifact
      uses: actions/upload-artifact@v7
      with:
        name: merged.gtfs.zip
        path: output/gtfs/merged.*.gtfs.zip*
        if-no-files-found: error
        compression-level: 0
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      BOUNDS: ${{ secrets.BOUNDS }}
      OUTPUT_AFFIX: ${{ secrets.OUTPUT_AFFIX }}
  prepare_final_graph:
    needs:
    - download_and_prepare_osm
    - prepare_street_graph
    - merge_and_pfaedle_gtfs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Download Merged GTFS artifact
      uses: actions/download-artifact@v8
      with:
        name: merged.gtfs.zip
        path: output/gtfs
    - name: Download street graph artifact
      uses: actions/download-artifact@v8
      with:
        name: streetGraph.obj
        path: output/opentripplanner
    - name: Derive hash from ParochialCacheKeys
      id: parochial_cache_keys
      run: |-
        echo "hash=$(
          find output -name "*.meta.json" | sort | xargs jq .ParochialCacheKey | shasum -a 1
        )" >> $GITHUB_OUTPUT
    - name: Cache transport graph
      id: cache_transport_graph
      uses: actions/cache@v5
      with:
        path: |
          output/opentripplanner/graph.obj*
          output/**/*.meta.json
        key: ${{ hashFiles('config.yml') }}-${{ steps.parochial_cache_keys.outputs.hash
          }}-otp.final-v1
    - uses: r-lib/actions/setup-r@v2
      if: steps.cache_transport_graph.outputs.cache-hit != 'true'
    - uses: r-lib/actions/setup-pandoc@v2
      if: steps.cache_transport_graph.outputs.cache-hit != 'true'
    - uses: r-lib/actions/setup-r-dependencies@v2
      if: steps.cache_transport_graph.outputs.cache-hit != 'true'
    - name: Download OTP
      if: steps.cache_transport_graph.outputs.cache-hit != 'true'
      run: |
        devtools::load_all()
        download_otp()
      shell: Rscript {0}
    - name: Install Java 25
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '25'
      if: steps.cache_transport_graph.outputs.cache-hit != 'true'
    - name: Prepare transport graph
      if: steps.cache_transport_graph.outputs.cache-hit != 'true'
      run: |
        devtools::load_all()
        prepare_transport_graph()
      shell: Rscript {0}
    - name: Upload transport graph artifact
      uses: actions/upload-artifact@v7
      with:
        name: graph.obj
        path: output/opentripplanner/graph.obj*
        if-no-files-found: error
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      BOUNDS: ${{ secrets.BOUNDS }}
      OUTPUT_AFFIX: ${{ secrets.OUTPUT_AFFIX }}

      
  prepare_r5r_network_dat:
    timeout-minutes: 90
    needs:
    - download_and_prepare_terrain
    - download_and_prepare_osm
    - merge_and_pfaedle_gtfs
    - create-runner
    runs-on: ${{  needs.create-runner.outputs.label }}
    steps:
    - uses: actions/checkout@v5
    - name: Download OpenStreetMap artifact
      uses: actions/download-artifact@v8
      with:
        name: openstreetmap
        path: output/openstreetmap/
    - name: Download Terrain 50 artifact
      uses: actions/download-artifact@v8
      with:
        name: terr50.tif
        path: output
    - name: Download Merged GTFS artifact
      uses: actions/download-artifact@v8
      with:
        name: merged.gtfs.zip
        path: output/gtfs
    - name: Derive hash from ParochialCacheKeys
      id: parochial_cache_keys
      run: |-
        echo "hash=$(
          find output -name "*.meta.json" | sort | xargs jq .ParochialCacheKey | shasum -a 1
        )" >> $GITHUB_OUTPUT
    - name: Cache r5r network.dat
      id: cache_network_dat
      uses: actions/cache@v5
      with:
        path: |
          output/r5r/network.dat*
        key: ${{ hashFiles('config.yml') }}-${{ steps.parochial_cache_keys.outputs.hash
          }}-r5r-v1
    - uses: r-lib/actions/setup-r@v2
      if: steps.cache_network_dat.outputs.cache-hit != 'true'
    - uses: r-lib/actions/setup-pandoc@v2
      if: steps.cache_network_dat.outputs.cache-hit != 'true'
    - uses: r-lib/actions/setup-r-dependencies@v2
      if: steps.cache_network_dat.outputs.cache-hit != 'true'
    - name: Install Java 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
      if: steps.cache_network_dat.outputs.cache-hit != 'true'
    - name: Prepare r5r network.dat
      if: steps.cache_network_dat.outputs.cache-hit != 'true'
      run: |
        devtools::load_all()
        prepare_r5r_network_dat()
      shell: Rscript {0}
    - name: Upload r5r network.dat artifact
      uses: actions/upload-artifact@v7
      with:
        name: network.dat
        path: output/r5r/network.dat*
        if-no-files-found: error
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      BOUNDS: ${{ secrets.BOUNDS }}
      OUTPUT_AFFIX: ${{ secrets.OUTPUT_AFFIX }}
      HOME: /home/runner

  delete-runner:
    name: Delete Hetzner Cloud runner
    needs:
      - create-runner # required to get output from the create-runner job
      - prepare_r5r_network_dat # required to wait when the main job is done
    runs-on: ubuntu-latest
    if: ${{ always() }} # required to stop the runner even if the error happened in the previous jobs
    steps:
      - name: Delete runner
        uses: Cyclenerd/hcloud-github-runner@v1
        with:
          mode: delete
          github_token: ${{ secrets.GH_PAT }}
          hcloud_token: ${{ secrets.HETZNER_API_TOKEN }}
          name: ${{ needs.create-runner.outputs.label }}
          server_id: ${{ needs.create-runner.outputs.server_id }}

